[package]
name = "quietcut"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Detect silent sections in OBS multi-track recordings and export a cut timeline"
license = "MIT"
publish = false

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Lets the release workflow run the full CI on a tag before building.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Integration tests fail instead of skipping when ffmpeg is missing.
  QUIETCUT_REQUIRE_FFMPEG: "1"

jobs:
  test:
    name: Build and test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux, stable
            os: ubuntu-latest
            toolchain: stable
          - name: macOS, stable
            os: macos-latest
            toolchain: stable
          # Keeps `rust-version` in Cargo.toml honest.
          - name: Linux, MSRV
            os: ubuntu-latest
            toolchain: "1.88"
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust ${{ matrix.toolchain }}
        env:
          TOOLCHAIN: ${{ matrix.toolchain }}
        run: |
          rustup toolchain install "$TOOLCHAIN" --profile minimal --no-self-update
          rustup default "$TOOLCHAIN"
          rustc --version

      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg

      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Show ffmpeg version
        run: |
          ffmpeg -version
          ffprobe -version

      - name: Build
        run: cargo build --locked --all-targets

      - name: Test
        run: cargo test --locked

  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy --no-self-update
          rustup default stable

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

name: Release

on:
  # Every push to main runs the full CI, then lets release-please open or
  # update the release pull request. Merging that pull request publishes.
  push:
    branches: [main]
  # Dry run: build and package without publishing whenever the release setup
  # or the dependency set changes.
  pull_request:
    paths:
      - .github/workflows/release.yml
      - release-please-config.json
      - .release-please-manifest.json
      - Cargo.toml
      - Cargo.lock
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: CI
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml

  release-please:
    name: Release PR
    needs: ci
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: release-please
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    name: Build ${{ matrix.target }}
    needs: release-please
    # A release was just created, or this is a dry run (release-please skipped).
    if: >-
      ${{ !cancelled() && !failure() &&
      (github.event_name != 'push' || needs.release-please.outputs.release_created == 'true') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            native: true
          - target: aarch64-apple-darwin
            os: macos-latest
            native: true
          - target: x86_64-apple-darwin
            os: macos-latest
            native: false
    env:
      TARGET: ${{ matrix.target }}
      # Empty on dry runs.
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The release tag when publishing, the triggering ref otherwise.
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal --target "$TARGET" --no-self-update
          rustup default stable
          rustc --version

      - name: Resolve version
        run: |
          version="v$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "quietcut") | .version')"
          if [ -n "$TAG" ] && [ "$TAG" != "$version" ]; then
            echo "::error::Release tag $TAG does not match the Cargo.toml version $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release --locked --target "$TARGET"

      - name: Smoke test
        env:
          NATIVE: ${{ matrix.native }}
        run: |
          binary="target/$TARGET/release/quietcut"
          file "$binary"
          if [ "$NATIVE" = "true" ]; then
            "$binary" --version
          fi

      - name: Package
        env:
          # Keeps macOS tar from adding AppleDouble (._*) files.
          COPYFILE_DISABLE: "1"
        run: |
          name="quietcut-$VERSION-$TARGET"
          mkdir -p "dist/$name"
          cp "target/$TARGET/release/quietcut" README.md LICENSE "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          tar -tzvf "dist/$name.tar.gz"

      - name: Upload archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quietcut-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Attach archives to the release
    needs: [release-please, build]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Write access for the upload only; this job compiles nothing.
      contents: write
    steps:
      - name: Download archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: quietcut-*
          path: dist
          merge-multiple: true

      - name: Write checksums
        working-directory: dist
        run: |
          sha256sum -- *.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        # --clobber keeps a re-run of failed jobs idempotent.
        run: gh release upload "$TAG" dist/*.tar.gz dist/SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
